version: "3.9"

services:

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noc_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////data/zammad_noc.db"
    volumes:
      - noc_data:/data
    networks:
      - noc_net

  # ── Frontend nginx ───────────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: noc_frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./noc-web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - noc_net

volumes:
  noc_data:

networks:
  noc_net:
    driver: bridge
